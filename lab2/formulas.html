    <h1>Хімічні та математичні формули</h1>

    <ol>
        <li>H<sub>2</sub>O — <em>Вода</em></li>
        <li>CO<sub>2</sub> — <em>Вуглекислий газ</em></li>
        <li>E = mc<sup>2</sup> — <em>Формула Ейнштейна</em></li>
        <li>a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup> — <em>Теорема Піфагора</em></li>
        <li>
            CH<sub>4</sub> + 2O<sub>2</sub> → CO<sub>2</sub> + 2H<sub>2</sub>O
            — <em>Реакція горіння метану</em>
        </li>
    </ol>
