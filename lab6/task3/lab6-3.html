<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторна 6 — Завдання 3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<form class="form">
  <h1 class="form-title">Реєстрація на курс</h1>
  <p class="form-intro">Заповніть форму, щоб записатися на курс. Поля зі зірочкою є обов’язковими для заповнення.</p>

  <div class="form-fields">
    <div class="form-group"><label class="form-label form-label--required" for="firstname">Ім'я</label><input class="form-input" type="text" id="firstname" required placeholder="Ім'я"></div>
    <div class="form-group"><label class="form-label form-label--required" for="lastname">Прізвище</label><input class="form-input" type="text" id="lastname" required placeholder="Прізвище"></div>
    <div class="form-group"><label class="form-label form-label--required" for="email">Email</label><input class="form-input" type="email" id="email" required placeholder="name@example.com"></div>
    <div class="form-group"><label class="form-label form-label--required" for="phone">Телефон</label><input class="form-input" type="tel" id="phone" required placeholder="+380XXXXXXXXX"></div>
    <div class="form-group"><label class="form-label form-label--required" for="password">Пароль</label><input class="form-input form-input--password" type="password" id="password" minlength="8" required placeholder="Пароль"></div>
    <div class="form-group"><label class="form-label form-label--required" for="repeat-password">Повторіть пароль</label><input class="form-input form-input--password" type="password" id="repeat-password" minlength="8" required placeholder="Повторіть пароль"></div>
  </div>

  <div class="form-group form-group--full"><label class="form-label" for="about">Про себе</label><textarea class="form-textarea" id="about" placeholder="Кілька слів про себе"></textarea></div>

  <ul class="form-hints"><li>Не менше 8 символів</li><li>Хоча б одна цифра</li><li>Хоча б одна велика літера</li><li>Паролі мають збігатися</li></ul>

  <p class="form-rules"><input type="checkbox" id="agree" required><label for="agree">Погоджуюсь з <a class="rules-link" href="#rules">правилами курсу</a></label></p>

  <div class="form-buttons"><button class="btn btn-reset" type="reset">Скасувати</button><button class="btn btn-submit" type="submit">Підтвердити</button></div>
</form>
</body>
</html>
