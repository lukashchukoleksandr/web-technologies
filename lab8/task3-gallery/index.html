<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея фотографій</title>
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>Галерея фотографій</h1>
    <div class="gallery">
    <figure class="gallery__tile"><img src="../assets/photos/green-coast.jpg" alt="Зелена затока з бірюзовою водою" loading="lazy"></figure>
    <figure class="gallery__tile"><img src="../assets/photos/forest-trail.jpg" alt="Стежка у тропічному лісі" loading="lazy"></figure>
    <figure class="gallery__tile"><img src="../assets/photos/hidden-cove.jpg" alt="Тиха кам’яниста бухта в тропіках" loading="lazy"></figure>
    <figure class="gallery__tile"><img src="../assets/photos/wooden-boat-inlet.jpg" alt="Традиційний човен на пляжі" loading="lazy"></figure>
    <figure class="gallery__tile"><img src="../assets/photos/longtail-boat.jpg" alt="Дерев’яний човен біля острова" loading="lazy"></figure>
    <figure class="gallery__tile gallery__tile--hero"><img src="../assets/photos/sunset-sailing.jpg" alt="Вітрильники на заході сонця"></figure>
    <figure class="gallery__tile"><img src="../assets/photos/shaded-jungle-path.jpg" alt="Тропічна стежка серед зелені" loading="lazy"></figure>
    <figure class="gallery__tile"><img src="../assets/photos/rocky-tropical-cove.jpg" alt="Тропічна бухта з деревами" loading="lazy"></figure>
    <figure class="gallery__tile"><img src="../assets/photos/tropical-boat.jpg" alt="Човен у прозорій морській воді" loading="lazy"></figure>
    <figure class="gallery__tile"><img src="../assets/photos/sailing-at-dusk.jpg" alt="Вітрильники на заході сонця над морем" loading="lazy"></figure>
    <figure class="gallery__tile"><img src="../assets/photos/turquoise-lagoon.jpg" alt="Острівна бухта з бірюзовою водою" loading="lazy"></figure>
    </div>
  </main>
</body>
</html>
